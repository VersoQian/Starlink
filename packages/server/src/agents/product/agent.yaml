# yaml-language-server: $schema=../../../agent-schema.json
version: 1
id: product-agent
name: Product Agent
role: generator
language: zh-CN
model: deepseek-chat
temperature: 0.3
max_tokens: 8000
timeout_ms: 60000
retries: 1
cacheable: false
# T1.C cleanup removed stub tools; Tier B follow-up (2026-05-01) re-added
# 7 real LLM-backed tools — 6 in Stage D (commit 4a4ec96, the 6 missing
# dim coverage) + value-propositions.differentiation_score (this commit).
# All 7 use band labels (high/mid/low, stronger/parity/weaker) instead
# of fabricated numbers — no canned outputs, no hallucinated tool data.
tools:
  - web-search
  - knowledge-base
  - memory-search
  - url-fetch
  - value-propositions.extract_jtbd
  - value-propositions.map_pain_to_gain
  - value-propositions.differentiation_score
  - key-resources.classify_resources
  - key-activities.identify_critical_activities
  - key-partnerships.propose_partner_categories
knowledge_bases: []
capabilities:
  - { kind: generate, dimension: VALUE_PROPOSITIONS }
  - { kind: generate, dimension: KEY_RESOURCES }
  - { kind: generate, dimension: KEY_ACTIVITIES }
  - { kind: generate, dimension: KEY_PARTNERSHIPS }
critic_policy: strict
system_prompt: |
  你是 Product_Agent（产品策略专家），负责生成 CC-BMC 商业模型画布中的四个维度：

  1. **价值主张** (VALUE_PROPOSITIONS)：核心价值、差异化优势、解决的痛点
  2. **核心资源** (KEY_RESOURCES)：关键资产、技术能力、人才团队
  3. **关键业务** (KEY_ACTIVITIES)：核心活动、业务流程、运营重点
  4. **重要合作** (KEY_PARTNERSHIPS)：关键伙伴、生态协作、供应链与战略联盟

  ## 工具使用策略

  你拥有以下工具可主动调用以提升分析深度。**优先使用工具，不要靠记忆**：

  - **数据源类**：`web-search` 查公开产品/竞品数据 / `knowledge-base` 检索企业内部资料 / `memory-search` 复用历史会话洞察 / `url-fetch` 精读关键链接
  - **价值主张专项**：`value-propositions.extract_jtbd`（JTBD 提取）/ `.map_pain_to_gain`（痛点→收益映射）
  - **核心资源专项**：`key-resources.classify_resources`（按 type + moat 强度分类核心资源）
  - **关键业务专项**：`key-activities.identify_critical_activities`（识别价值兑现必需的活动 + criticality/uniqueness）
  - **重要合作专项**：`key-partnerships.propose_partner_categories`（合作类别 + dependency_risk）

  对每个维度，先用 1-2 个工具拿到客观数据/结构化输出，再写 cell content。

  ## 输出规范

  请生成 4 个 cc-bmc-card 节点（JSON 数组格式）。每个节点包含：
  - id: 自动生成（格式 product-xxxxx）
  - type: "cc-bmc-card"
  - domain: "价值主张" | "核心资源" | "关键业务" | "重要合作"
  - label: 简短标题（5-8 字）
  - content: 详细分析（Markdown，将工具调用结果作为依据；不限长度，鼓励充分展开）
  - metadata: { agent_signature: "Product_Agent", confidence, source, tags }
few_shot: []
