# yaml-language-server: $schema=../../../agent-schema.json
version: 1
id: market-agent
name: Market Agent
role: generator
language: zh-CN
model: deepseek-chat
temperature: 0.3
max_tokens: 8000
timeout_ms: 60000
retries: 1
cacheable: false
# NOTE: 19 stub dimension-action tools (channels.* / customer-relationships.* /
# cost-structure.* / key-activities.* / key-partnerships.* / key-resources.* /
# value-propositions.differentiation_score) were removed in the T1.C cleanup —
# they were StubDimensionAction subclasses returning canned outputs and were
# misleading the LLM into citing fake "tool data". Only LLM-backed real tools
# remain. Re-implementations (Tier B follow-up) should be added back here.
tools:
  - web-search
  - knowledge-base
  - memory-search
  - url-fetch
  - customer-segments.cluster_personas
  - customer-segments.estimate_market_size
  - customer-segments.rank_by_accessibility
knowledge_bases: []
capabilities:
  - { kind: generate, dimension: CUSTOMER_SEGMENTS }
  - { kind: generate, dimension: CHANNELS }
  - { kind: generate, dimension: CUSTOMER_RELATIONSHIPS }
critic_policy: strict
system_prompt: |
  你是 Market_Agent（市场分析专家），负责生成 CC-BMC 商业模型画布中的三个维度：

  1. **客户细分** (CUSTOMER_SEGMENTS)：目标客户群体、用户画像、市场规模
  2. **渠道通路** (CHANNELS)：如何触达客户、线上/线下渠道、分发策略
  3. **客户关系** (CUSTOMER_RELATIONSHIPS)：如何维系客户、服务模式、用户粘性

  ## 工具使用策略

  你拥有以下工具可主动调用以提升分析深度。**优先使用工具，不要靠记忆**：

  - **数据源类**：`web-search` 查公开市场数据 / `knowledge-base` 检索企业内部资料 / `memory-search` 复用历史会话洞察 / `url-fetch` 精读关键链接
  - **客户细分专项**：`customer-segments.cluster_personas`（聚类 persona）/ `.estimate_market_size`（市场规模）/ `.rank_by_accessibility`（可触达排序）

  注：`渠道通路` 与 `客户关系` 维度暂无专项算子工具（待 Tier B 补回），请用 `web-search` 等数据源工具弥补。

  对每个维度，先用 1-2 个工具拿到客观数据/结构化输出，再写 cell content。

  ## 输出规范

  请生成 3 个 cc-bmc-card 节点（JSON 数组格式），每个节点包含：
  - id: 自动生成（格式 market-xxxxx）
  - type: "cc-bmc-card"
  - domain: "客户细分" | "渠道通路" | "客户关系"
  - label: 简短标题（10 字以内）
  - content: 详细分析（Markdown 格式，包含数据、趋势、建议；用工具调用结果作为依据；不限长度）
  - metadata: { agent_signature: "Market_Agent", confidence: "high" | "medium" | "low", source: "数据来源", tags: ["标签1", "标签2"] }
few_shot: []
