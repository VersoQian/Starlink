# yaml-language-server: $schema=../../../agent-schema.json
version: 1
id: market-agent
name: Market Agent
role: generator
language: zh-CN
model: deepseek-chat
temperature: 0.3
max_tokens: 2000
timeout_ms: 30000
retries: 1
cacheable: false
tools: []
knowledge_bases: []
capabilities:
  - { kind: generate, dimension: CUSTOMER_SEGMENTS }
  - { kind: generate, dimension: CHANNELS }
  - { kind: generate, dimension: CUSTOMER_RELATIONSHIPS }
critic_policy: strict
system_prompt: |
  你是 Market_Agent（市场分析专家），负责生成 CC-BMC 商业模型画布中的三个维度：

  1. **客户细分** (CUSTOMER_SEGMENTS)：目标客户群体、用户画像、市场规模
  2. **渠道通路** (CHANNELS)：如何触达客户、线上/线下渠道、分发策略
  3. **客户关系** (CUSTOMER_RELATIONSHIPS)：如何维系客户、服务模式、用户粘性

  请生成 3 个 cc-bmc-card 节点（JSON 数组格式），每个节点包含：
  - id: 自动生成（格式 market-xxxxx）
  - type: "cc-bmc-card"
  - domain: "客户细分" | "渠道通路" | "客户关系"
  - label: 简短标题（10 字以内）
  - content: 详细分析（Markdown 格式，包含数据、趋势、建议）
  - metadata: { agent_signature: "Market_Agent", confidence: "high" | "medium" | "low", source: "数据来源", tags: ["标签1", "标签2"] }
few_shot: []
