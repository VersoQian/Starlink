<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180">
  <defs>
    <style>
      .page { fill: #ffffff; }
      .rule { stroke: #111827; stroke-width: 2; }
      .thin { stroke: #111827; stroke-width: 1.2; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 700; fill: #111827; }
      .caption { font-family: Georgia, 'Times New Roman', serif; font-size: 24px; font-style: italic; fill: #111827; }
      .mono { font-family: Menlo, Consolas, 'Courier New', monospace; font-size: 22px; fill: #111827; }
      .monoSmall { font-family: Menlo, Consolas, 'Courier New', monospace; font-size: 20px; fill: #111827; }
      .kw { font-weight: 700; }
      .muted { fill: #374151; }
    </style>
  </defs>
  <rect class="page" x="0" y="0" width="1500" height="1180"/>

  <text x="100" y="70" class="title">Algorithm-Style Pseudocode for Blackboard Coordination</text>
  <text x="100" y="108" class="caption">LaTeX-style rendering for Chapter 3 method definitions</text>

  <!-- Algorithm 1 -->
  <line class="rule" x1="100" y1="150" x2="1400" y2="150"/>
  <text x="120" y="190" class="caption">Algorithm 1: MergeByIdentity</text>
  <line class="thin" x1="100" y1="215" x2="1400" y2="215"/>
  <text x="120" y="250" class="monoSmall">Input: oldList, newList</text>
  <text x="120" y="282" class="monoSmall">Output: merged list with unique item identifiers</text>
  <line class="thin" x1="100" y1="306" x2="1400" y2="306"/>
  <text x="120" y="345" class="mono">1:  result ← copy oldList indexed by item.id</text>
  <text x="120" y="382" class="mono">2:  for each item in newList do</text>
  <text x="120" y="419" class="mono">3:      result[item.id] ← item</text>
  <text x="120" y="456" class="mono">4:  end for</text>
  <text x="120" y="493" class="mono">5:  return result as a list</text>
  <line class="rule" x1="100" y1="525" x2="1400" y2="525"/>

  <!-- Algorithm 2 -->
  <line class="rule" x1="100" y1="585" x2="1400" y2="585"/>
  <text x="120" y="625" class="caption">Algorithm 2: BlackboardUpdate</text>
  <line class="thin" x1="100" y1="650" x2="1400" y2="650"/>
  <text x="120" y="685" class="monoSmall">Input: state, slot, value</text>
  <text x="120" y="717" class="monoSmall">Output: updated BusinessState</text>
  <line class="thin" x1="100" y1="741" x2="1400" y2="741"/>
  <text x="120" y="780" class="mono">1:  if slot is a list-type field then</text>
  <text x="120" y="817" class="mono">2:      state[slot] ← MergeByIdentity(state[slot], value)</text>
  <text x="120" y="854" class="mono">3:  else</text>
  <text x="120" y="891" class="mono">4:      state[slot] ← value</text>
  <text x="120" y="928" class="mono">5:  end if</text>
  <text x="120" y="965" class="mono">6:  return state</text>
  <line class="rule" x1="100" y1="997" x2="1400" y2="997"/>

  <!-- Algorithm 3 -->
  <line class="rule" x1="100" y1="1055" x2="1400" y2="1055"/>
  <text x="120" y="1095" class="caption">Algorithm 3: SupervisorDispatch (compact form)</text>
  <line class="thin" x1="100" y1="1120" x2="1400" y2="1120"/>
  <text x="120" y="1155" class="monoSmall">Continued on next figure/page if needed for the full dispatch logic.</text>
</svg>