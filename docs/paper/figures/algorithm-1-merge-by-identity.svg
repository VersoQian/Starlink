<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="520" viewBox="0 0 1300 520">
  <defs>
    <style>
      .page { fill: #ffffff; }
      .rule { stroke: #111827; stroke-width: 2; }
      .thin { stroke: #111827; stroke-width: 1.1; }
      .caption { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-style: italic; fill: #111827; }
      .mono { font-family: Menlo, Consolas, 'Courier New', monospace; font-size: 25px; fill: #111827; }
      .monoSmall { font-family: Menlo, Consolas, 'Courier New', monospace; font-size: 23px; fill: #111827; }
      .note { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; fill: #374151; }
    </style>
  </defs>
  <rect class="page" x="0" y="0" width="1300" height="520"/>

  <line class="rule" x1="70" y1="55" x2="1230" y2="55"/>
  <text x="90" y="100" class="caption">Algorithm 1: MergeByIdentity</text>
  <line class="thin" x1="70" y1="128" x2="1230" y2="128"/>

  <text x="90" y="170" class="monoSmall">Input: oldList, newList</text>
  <text x="90" y="205" class="monoSmall">Output: merged list with unique item identifiers</text>
  <line class="thin" x1="70" y1="232" x2="1230" y2="232"/>

  <text x="90" y="277" class="mono">1:  result ← copy oldList indexed by item.id</text>
  <text x="90" y="318" class="mono">2:  for each item in newList do</text>
  <text x="90" y="359" class="mono">3:      result[item.id] ← item</text>
  <text x="90" y="400" class="mono">4:  end for</text>
  <text x="90" y="441" class="mono">5:  return result as a list</text>

  <line class="rule" x1="70" y1="475" x2="1230" y2="475"/>
</svg>