<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #243447; stroke-width: 2.2; rx: 18; }
      .head { fill: #243447; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #34495e; }
      .body { font-family: Menlo, Consolas, monospace; font-size: 23px; fill: #1f2933; }
      .body-small { font-family: Menlo, Consolas, monospace; font-size: 21px; fill: #1f2933; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #243447; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #4a5568; }
      .arrow { stroke: #0b6bcb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .chip { fill: #e8f2ff; stroke: #7ab4f8; stroke-width: 1.5; rx: 10; }
      .warn { fill: #fff6e5; stroke: #f1b44c; stroke-width: 1.5; rx: 10; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0b6bcb"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <text x="80" y="70" style="font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 700; fill:#16202a;">
    Pseudocode Definitions for Blackboard Coordination
  </text>
  <text x="80" y="112" class="subtitle">
    Replace fragile mathematical formulas with readable software-engineering pseudocode.
  </text>

  <!-- Panel 1 -->
  <rect class="panel" x="70" y="155" width="460" height="690"/>
  <rect class="head" x="70" y="155" width="460" height="78" rx="18"/>
  <text x="95" y="205" class="title">Definition 1</text>
  <text x="95" y="270" class="label">MergeByIdentity</text>
  <text x="95" y="310" class="note">Used for list-type blackboard fields.</text>

  <rect class="chip" x="95" y="345" width="385" height="70"/>
  <text x="120" y="388" class="body-small">oldList + newList</text>
  <path class="arrow" d="M287 420 L287 465"/>
  <rect class="chip" x="95" y="475" width="385" height="70"/>
  <text x="120" y="518" class="body-small">index items by item.id</text>
  <path class="arrow" d="M287 550 L287 595"/>
  <rect class="chip" x="95" y="605" width="385" height="70"/>
  <text x="120" y="648" class="body-small">later value wins</text>

  <text x="95" y="735" class="body-small">for each item in newList:</text>
  <text x="125" y="770" class="body-small">result[item.id] = item</text>
  <text x="95" y="805" class="body-small">return result as list</text>

  <!-- Panel 2 -->
  <rect class="panel" x="570" y="155" width="460" height="690"/>
  <rect class="head" x="570" y="155" width="460" height="78" rx="18"/>
  <text x="595" y="205" class="title">Definition 2</text>
  <text x="595" y="270" class="label">BlackboardUpdate</text>
  <text x="595" y="310" class="note">Only state-mutation primitive.</text>

  <text x="595" y="370" class="body-small">BlackboardUpdate(state, slot, value):</text>
  <text x="625" y="415" class="body-small">if slot is list-type:</text>
  <text x="655" y="455" class="body-small">state[slot] =</text>
  <text x="685" y="490" class="body-small">MergeByIdentity(...)</text>
  <text x="625" y="535" class="body-small">else:</text>
  <text x="655" y="575" class="body-small">state[slot] = value</text>
  <text x="625" y="620" class="body-small">return state</text>

  <rect class="warn" x="595" y="675" width="385" height="100"/>
  <text x="620" y="714" class="note">Replay property:</text>
  <text x="620" y="748" class="note">same initial state + same</text>
  <text x="620" y="776" class="note">updates => same final state.</text>

  <!-- Panel 3 -->
  <rect class="panel" x="1070" y="155" width="460" height="690"/>
  <rect class="head" x="1070" y="155" width="460" height="78" rx="18"/>
  <text x="1095" y="205" class="title">Definition 3</text>
  <text x="1095" y="270" class="label">SupervisorDispatch</text>
  <text x="1095" y="310" class="note">Selects agents and execution mode.</text>

  <text x="1095" y="365" class="body-small">intent = classify(state)</text>
  <text x="1095" y="405" class="body-small">activeAgents = matching agents</text>
  <path class="arrow" d="M1300 420 L1300 465"/>

  <rect class="chip" x="1095" y="475" width="385" height="85"/>
  <text x="1120" y="512" class="body-small">if generate_bmc round 0:</text>
  <text x="1150" y="545" class="body-small">mode = parallel</text>

  <path class="arrow" d="M1300 565 L1300 610"/>
  <rect class="chip" x="1095" y="620" width="385" height="95"/>
  <text x="1120" y="657" class="body-small">if high-severity conflict:</text>
  <text x="1150" y="690" class="body-small">mode = review</text>

  <text x="1095" y="775" class="body-small">return { intent, activeAgents, mode }</text>

  <!-- Bottom note -->
  <rect x="70" y="875" width="1460" height="70" rx="16" fill="#eaf3ef" stroke="#73a58c" stroke-width="1.6"/>
  <text x="95" y="918" style="font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill:#234536;">
    Purpose: make the coordination method readable in Word and avoid blank equation rendering in Chapter 3.
  </text>
</svg>
