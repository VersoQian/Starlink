# Starlink local development stack.
#
# Usage:
#   docker compose up -d                 # full stack: PG + Redis + server + web
#   docker compose up -d postgres redis  # deps only (server runs locally via pnpm dev)
#   docker compose logs -f server        # tail server logs
#
# First boot: PG runs the pgvector init in initdb hook (CREATE EXTENSION vector).
# Migration is on the user — run `pnpm --filter @starlink/server db:migrate`
# from the host once the stack is up. This file intentionally matches
# packages/server/.env.pg-local: localhost:5431, user sheng, database kb_dev.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: starlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sheng
      POSTGRES_DB: kb_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5431:5432"
    volumes:
      - starlink-pg-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheng -d kb_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: starlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - starlink-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: starlink-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Connection — point at the in-network service names, NOT host:5432
      DATABASE_URL: postgres://sheng@postgres:5432/kb_dev
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      NODE_ENV: production
      # Production gates — populate via .env or your secrets store
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # LLM
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Embedding (optional but strongly recommended for KB)
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # Feature flags
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-legacy}
      LANGGRAPH_CHECKPOINTER_ENABLED: ${LANGGRAPH_CHECKPOINTER_ENABLED:-true}
      MEMORY_READ_ENABLED: ${MEMORY_READ_ENABLED:-true}
      MEMORY_WRITE_ENABLED: ${MEMORY_WRITE_ENABLED:-true}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser-side GraphQL must use the host-mapped URL, not the
        # Docker-internal service name, because the user's browser runs
        # outside the compose network.
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
    container_name: starlink-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  starlink-pg-data:
  starlink-redis-data:
